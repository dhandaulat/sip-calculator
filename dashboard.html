
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groww Clone Dashboard</title>
    <!-- Tailwind CSS Script for direct use -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <!-- 1. TOP NAVBAR -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50 px-6 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-8">
            <span class="text-2xl font-bold text-[#00d09c] tracking-wide">groww</span>
            <div class="hidden md:flex space-x-6 text-sm font-medium text-gray-600">
                <a href="#" class="text-[#00d09c] border-b-2 border-[#00d09c] pb-4 -mb-4">Stocks</a>
                <a href="#" class="hover:text-[#00d09c]">Mutual Funds</a>
            </div>
        </div>
        <div class="w-1/3 hidden md:block">
            <input type="text" placeholder="Search stocks..." class="w-full bg-gray-100 border border-transparent focus:border-gray-300 focus:bg-white px-4 py-2 rounded-md text-sm outline-none transition">
        </div>
        <div>
            <button class="text-gray-600 hover:text-gray-900 text-sm font-medium">Log In</button>
        </div>
    </nav>

    <!-- 2. MAIN BODY -->
    <div class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Market Trends -->
        <div class="lg:col-span-2 space-y-6">
            <h1 class="text-2xl font-bold">Market Trends</h1>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                    <p class="text-sm text-gray-500 font-medium">NIFTY 50</p>
                    <p class="text-xl font-bold mt-1">22,038.40</p>
                    <p class="text-sm text-green-500 font-medium mt-1">+140.20 (0.64%)</p>
                </div>
                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                    <p class="text-sm text-gray-500 font-medium">SENSEX</p>
                    <p class="text-xl font-bold mt-1">72,500.10</p>
                    <p class="text-sm text-green-500 font-medium mt-1">+450.90 (0.62%)</p>
                </div>
            </div>
            <!-- Chart Container -->
            <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm h-64 flex items-center justify-center text-gray-400">
                [ TradingView Chart Coming Soon ]
            </div>
        </div>

        <!-- Watchlist -->
        <div class="space-y-6">
            <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                <h2 class="font-bold text-lg mb-4">Your Watchlist</h2>
                <div class="divide-y divide-gray-100">
                    <div class="py-3 flex justify-between items-center">
                        <div><p class="font-medium text-sm">Reliance Industries</p><p class="text-xs text-gray-400">NSE</p></div>
                        <div class="text-right"><p class="font-semibold text-sm">₹2,450.50</p><p class="text-xs text-green-500 font-medium">+1.2%</p></div>
                    </div>
                    <div class="py-3 flex justify-between items-center">
                        <div><p class="font-medium text-sm">TCS</p><p class="text-xs text-gray-400">NSE</p></div>
                        <div class="text-right"><p class="font-semibold text-sm">₹3,820.15</p><p class="text-xs text-red-500 font-medium">-0.8%</p></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
